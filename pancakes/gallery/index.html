<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="../style.css" rel="stylesheet" type="text/css" media="all">
    <title>Our Gallery</title>
  </head>
  <body>
    <nav>
      <a href="../index.html">&larr; Back to home</a> |
      <a href="../main_page.html">The Main Page</a> |
      <a href="/">&larr; Back to neptune</a>
    </nav>
    <h1>our gallery &hearts;</h1>
    <p class="gallery-note">a few of my favorite pictures with you. more to come, always.</p>
    <div class="gallery" id="gallery"></div>
    <script>
      const gallery = document.getElementById("gallery");
      const unit = 150;
      const spanFor = (w, h) => ({
        c: Math.min(Math.max(Math.round(w / unit), 1), 3),
        r: Math.min(Math.max(Math.round(h / unit), 1), 3),
      });

      fetch("images.json")
        .then((r) => (r.ok ? r.json() : Promise.reject()))
        .then((items) => {
          if (!items.length) {
            gallery.textContent = "no pictures yet ♡";
            return;
          }
          for (const item of items) {
            const span = spanFor(item.w, item.h);
            const figure = document.createElement("figure");
            figure.style.gridColumn = `span ${span.c}`;
            figure.style.gridRow = `span ${span.r}`;
            const img = document.createElement("img");
            img.src = `images/${item.file}`;
            img.alt = item.file.replace(/\.[^.]+$/, "");
            figure.appendChild(img);
            const caption = document.createElement("figcaption");
            caption.textContent = item.file.replace(/\.[^.]+$/, "");
            figure.appendChild(caption);
            gallery.appendChild(figure);
          }
        })
        .catch(() => {
          gallery.textContent = "couldn't load the gallery :(";
        });
    </script>
  </body>
</html>
